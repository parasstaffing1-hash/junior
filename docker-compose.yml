services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER before starting Compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before starting Compose}
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_BYTES: 104857600
      APP_ENV: production
      AUTH_MODE: api_key
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY before starting production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      REQUIRE_TENANT_HEADER: "true"
      JOB_WORKER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL before starting Compose}
      STORAGE_ROOT: /app/storage
      APP_ENV: production
      AUTH_MODE: api_key
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY before starting production}
      JOB_WORKER_ENABLED: "true"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
