services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:adminpassword@db:5432/analytics
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_BYTES: 104857600
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
